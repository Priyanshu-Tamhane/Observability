apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'Loki'
        query: '{job="observable-agent"} |= "$${__trace.id}"'
        tags: ['trace_id']
      tracesToMetrics:
        datasourceUid: 'Prometheus'
        queries:
          - name: 'Agent Latency'
            query: 'sum(rate(agent_run_duration_seconds_sum[1m])) by (status)'

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: 'TraceID'
          matcherRegex: '(?i)"trace_id":\s*"([a-f0-9]{32})"'
          url: '$${__value.raw}'
          datasourceUid: 'Tempo'
